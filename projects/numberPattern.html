<!DOCTYPE html>
<html>

<head>

<title>Number Pattern</title>

<style>

body{
background:#ede7f6;
font-family:Arial;
text-align:center;
margin-top:60px;
}

input,button{
padding:10px;
margin:10px;
}

button{
background:purple;
color:white;
border:none;
}

#output{
font-size:20px;
font-weight:bold;
margin-top:20px;
}

</style>

</head>

<body>

<h2>Number Pattern</h2>

<input type="number" id="number">

<button id="btn">Show Pattern</button>

<p id="output"></p>

<script>

let btn=document.querySelector("#btn");

btn.addEventListener("click",showPattern);

function showPattern(){

let number=document.querySelector("#number").value;

let result="";

for(let i=1;i<=number;i++){

for(let j=1;j<=i;j++){

result=result+j;

}

result=result+"<br>";

}

document.querySelector("#output").innerHTML=result;

}

</script>

</body>

</html>
