<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            text-align: center;
            margin-top: 50px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: #2c3e50;
        }

        input {
            width: 70%;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #219150;
        }

        #list {
            margin-top: 20px;
            text-align: left;
            font-size: 18px;
        }

        #total {
            margin-top: 20px;
            font-weight: bold;
            color: #e74c3c;
            font-size: 18px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Shopping List</h1>

        <input type="text" id="item" placeholder="Enter new item">

        <button id="addBtn">Add Item</button>

        <div id="list"></div>

        <div id="total"></div>

    </div>

    <script>

        let shoppingList = ["Milk", "Bread", "Eggs", "Rice", "Sugar"];

        let list = document.querySelector("#list");
        let total = document.querySelector("#total");
        let input = document.querySelector("#item");
        let button = document.querySelector("#addBtn");

        function displayList() {

            let output = "";

            for (let i = 0; i < shoppingList.length; i++) {
                output += (i + 1) + ". " + shoppingList[i] + "<br>";
            }

            list.innerHTML = output;
            total.innerHTML = "Total Items: " + shoppingList.length;
        }

        function addItem() {

            let newItem = input.value;

            if (newItem != "") {

                shoppingList.push(newItem);

                displayList();

                input.value = "";
            }

        }

        button.addEventListener("click", addItem);

        displayList();

    </script>

</body>

</html>
