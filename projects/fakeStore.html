<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 30px;
            font-weight: bold;
        }

        #products {
            width: 90%;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 150px;
            height: 180px;
            object-fit: contain;
        }

        .title {
            font-size: 18px;
            margin: 10px 0;
            height: 60px;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
            margin: 10px;
        }

        .category {
            color: gray;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            background: dodgerblue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: blue;
        }
    </style>

</head>

<body>

<header>
    FakeStore E-Commerce
</header>

<div id="products">

</div>

<script>

let products = document.querySelector("#products");

fetch("https://fakestoreapi.com/products")

.then(function(response){

    return response.json();

})

.then(function(data){

    showProducts(data);

});

function showProducts(items){

    let output = "";

    items.forEach(function(product){

        output += `
        
        <div class="card">

            <img src="${product.image}">

            <h3 class="title">${product.title}</h3>

            <p class="category">${product.category}</p>

            <h2 class="price">$${product.price}</h2>

            <button>Add To Cart</button>

        </div>

        `;

    });

    products.innerHTML = output;

}

</script>

</body>

</html>
