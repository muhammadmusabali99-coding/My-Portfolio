<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Methods</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1b4332, #0d2818);
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            color: #f1faee;
            padding: 20px;
        }

        .board {
            width: 100%;
            max-width: 720px;
        }

        h1.title {
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 1.4rem;
            color: #ffd166;
            margin-bottom: 24px;
        }

        .row {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .team {
            flex: 1;
            min-width: 220px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: border-color 0.3s, transform 0.3s;
        }

        .team.active {
            transform: translateY(-6px);
        }

        .teamA {
            border-color: rgba(230, 57, 70, 0.3);
        }

        .teamA.active {
            border-color: #e63946;
            box-shadow: 0 0 24px rgba(230, 57, 70, 0.5);
        }

        .teamB {
            border-color: rgba(69, 123, 157, 0.3);
        }

        .teamB.active {
            border-color: #457b9d;
            box-shadow: 0 0 24px rgba(69, 123, 157, 0.5);
        }

        .team h4 {
            margin: 0 0 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .total {
            font-size: 2.4rem;
            font-weight: bold;
            margin: 0 0 12px;
        }

        .teamA .total {
            color: #e63946;
        }

        .teamB .total {
            color: #457b9d;
        }

        /* Dice */
        .dice {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            background: #f1faee;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 10px;
            box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        .dice.rolling {
            animation: shake 0.15s infinite;
        }

        @keyframes shake {
            0% {
                transform: rotate(-6deg);
            }

            50% {
                transform: rotate(6deg);
            }

            100% {
                transform: rotate(-6deg);
            }
        }

        .pip {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1b4332;
            align-self: center;
            justify-self: center;
            opacity: 0;
        }

        button {
            background: #ffd166;
            border: none;
            color: #1b4332;
            font-weight: bold;
            padding: 10px 22px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: transform 0.15s, opacity 0.15s;
        }

        button:hover:not(:disabled) {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .turns-box {
            text-align: center;
            padding-top: 30px;
        }

        .turns-box h4 {
            margin: 0;
            opacity: 0.7;
            letter-spacing: 2px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .turns-box h2 {
            margin: 4px 0 0;
        }

        /* Winner banner */
        .banner {
            display: none;
            text-align: center;
            margin-top: 28px;
            padding: 18px;
            border-radius: 14px;
            background: rgba(255, 209, 102, 0.15);
            border: 2px solid #ffd166;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd166;
        }

        .banner.show {
            display: block;
        }

        .reset {
            display: block;
            margin: 16px auto 0;
        }
    </style>
</head>

<body>
    <div class="board">
        <h1 class="title">Number Methods</h1>

        <div class="row">
            <div class="team teamA active" id="cardA">
                <h4>Team A</h4>
                <div class="total"><span id="total_number_1">0</span></div>
                <p>Average :
                    <span id="avgA">0.00</span>
                </p>
                <p>Best :
                    <span id="bestA">0</span>
                </p>

                <p>Worst :
                    <span id="worstA">0</span>
                </p>
                <div class="dice" id="dice_1">
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                </div>
                <button id="roll_dice_1">Roll Dice</button>
            </div>

            <div class="turns-box">
                <h4>Turns</h4>
                <h2><span id="teamA_turns">0</span> : <span id="teamB_turns">0</span></h2>
            </div>

            <div class="team teamB" id="cardB">
                <h4>Team B</h4>
                <div class="total"><span id="total_number_2">0</span></div>
                <p>Average :
                    <span id="avgB">0.00</span>
                </p>
                <p>Best :
                    <span id="bestB">0</span>
                </p>
                <p>Worst :
                    <span id="worstB">0</span>
                </p>
                <div class="dice" id="dice_2">
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                    <div class="pip"></div>
                </div>
                <button id="roll_dice_2">Roll Dice</button>
            </div>
        </div>

        <div class="banner" id="banner"></div>
        <button class="reset" id="reset_btn" style="display:none;">Play Again</button>
    </div>

    <script>

        let avgA = document.getElementById("avgA")
        let avgB = document.getElementById("avgB")
        let bestAtext = document.getElementById("bestA")
        let worstAtext = document.getElementById("worstA")
        let bestBtext = document.getElementById("bestB")
        let worstBtext = document.getElementById("worstB")
        let total_number_1 = document.getElementById("total_number_1")
        let dice_1 = document.getElementById("dice_1")
        let roll_dice_1 = document.getElementById("roll_dice_1")
        let total_number_2 = document.getElementById("total_number_2")
        let dice_2 = document.getElementById("dice_2")
        let roll_dice_2 = document.getElementById("roll_dice_2")
        let teamA_turns = document.getElementById("teamA_turns")
        let teamB_turns = document.getElementById("teamB_turns")
        let cardA = document.getElementById("cardA")
        let cardB = document.getElementById("cardB")
        let banner = document.getElementById("banner")
        let reset_btn = document.getElementById("reset_btn")

        let turnOf = "A"
        const MAX_TURNS = 5 // rounds per team before the game ends
        let bestA = 0
        let worstA = 100

        let bestB = 0
        let worstB = 100

        // which pips (by index 0-8) light up for each dice number, on a 3x3 grid
        const pipMap = {
            1: [4],
            2: [0, 8],
            3: [0, 4, 8],
            4: [0, 2, 6, 8],
            5: [0, 2, 4, 6, 8],
            6: [0, 2, 3, 5, 6, 8]
        }

        roll_dice_2.disabled = true

        let generateNumber = () => {
            let random = Math.random() * 12
            random = Math.ceil(random)
            return random
        }

        // let showFace = (diceEl, number) => {
        //     let pips = diceEl.querySelectorAll(".pip")
        //     pips.forEach(p => p.style.opacity = 0)
        //     pipMap[number].forEach(i => pips[i].style.opacity = 1)
        // }

        let showFace = (diceEl, number) => {

            if (number > 6) {
                diceEl.innerHTML = `
        <h2 style="color:black;text-align:center;margin-top:15px;">
        ${number}
        </h2>`
                return
            }

            diceEl.innerHTML = `
        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
    `

            let pips = diceEl.querySelectorAll(".pip")

            pips.forEach(p => p.style.opacity = 0)

            pipMap[number].forEach(i => {
                pips[i].style.opacity = 1
            })

        }

        let animateRoll = (diceEl, finalNumber, onDone) => {
            diceEl.classList.add("rolling")
            let ticks = 0
            let spin = setInterval(() => {
                showFace(diceEl, generateNumber())
                ticks++
                if (ticks > 8) {
                    clearInterval(spin)
                    diceEl.classList.remove("rolling")
                    showFace(diceEl, finalNumber)
                    onDone()
                }
            }, 60)
        }

        let checkWinner = () => {
            let turnsA = +teamA_turns.innerHTML
            let turnsB = +teamB_turns.innerHTML
            // if (turnsA >= MAX_TURNS && turnsB >= MAX_TURNS) {

            let scoreA = +total_number_1.innerHTML
            let scoreB = +total_number_2.innerHTML
            if (scoreA >= 50 || scoreB >= 50) {
                roll_dice_1.disabled = true
                roll_dice_2.disabled = true
                cardA.classList.remove("active")
                cardB.classList.remove("active")

                if (scoreA === scoreB) {
                    banner.innerHTML = `It's a tie! Both teams scored ${scoreA}`
                } else {
                    let winner = scoreA > scoreB ? "Team A" : "Team B"
                    banner.innerHTML = `🏆 ${winner} wins with ${Math.max(scoreA, scoreB)} points!`
                }
                banner.classList.add("show")
                reset_btn.style.display = "block"
                return true
            }
            return false
        }

        let rollDice = () => {
            if (turnOf == "A") {
                roll_dice_1.disabled = true
                let diceResult = generateNumber()
                animateRoll(dice_1, diceResult, () => {
                    //total_number_1.innerHTML = +total_number_1.innerHTML + diceResult
                    let score = diceResult

                    if (diceResult == 6) {

                        score *= 2

                        banner.innerHTML = "🎉 Team A got Double Points!"
                        banner.classList.add("show")

                        setTimeout(() => {
                            banner.classList.remove("show")
                        }, 10000)

                    }

                    total_number_1.innerHTML =
                        +total_number_1.innerHTML + score
                    teamA_turns.innerHTML = +teamA_turns.innerHTML + 1
                    bestA = Math.max(bestA, diceResult)
                    worstA = Math.min(worstA, diceResult)

                    bestAtext.innerHTML = bestA
                    worstAtext.innerHTML = worstA
                    avgA.innerHTML = (+total_number_1.innerHTML / +teamA_turns.innerHTML).toFixed(2)

                    if (checkWinner()) return

                    turnOf = "B"
                    cardA.classList.remove("active")
                    cardB.classList.add("active")
                    roll_dice_2.disabled = false
                })
            } else {
                roll_dice_2.disabled = true
                let diceResult = generateNumber()
                animateRoll(dice_2, diceResult, () => {
                    total_number_2.innerHTML = +total_number_2.innerHTML + diceResult
                    teamB_turns.innerHTML = +teamB_turns.innerHTML + 1
                    bestB = Math.max(bestB, diceResult)
                    worstB = Math.min(worstB, diceResult)

                    bestBtext.innerHTML = bestB
                    worstBtext.innerHTML = worstB
                    avgB.innerHTML = (+total_number_2.innerHTML / +teamB_turns.innerHTML).toFixed(2)

                    if (checkWinner()) return

                    turnOf = "A"
                    cardB.classList.remove("active")
                    cardA.classList.add("active")
                    roll_dice_1.disabled = false
                })
            }
        }

        let resetGame = () => {
            total_number_1.innerHTML = 0
            total_number_2.innerHTML = 0
            teamA_turns.innerHTML = 0
            teamB_turns.innerHTML = 0
            bestA = 0
            worstA = 100

            bestB = 0
            worstB = 100

            bestAtext.innerHTML = 0
            worstAtext.innerHTML = 0

            bestBtext.innerHTML = 0
            worstBtext.innerHTML = 0
            showFace(dice_1, 1)
            showFace(dice_2, 1)
            dice_1.querySelectorAll(".pip").forEach(p => p.style.opacity = 0)
            dice_2.querySelectorAll(".pip").forEach(p => p.style.opacity = 0)
            turnOf = "A"
            roll_dice_1.disabled = false
            roll_dice_2.disabled = true
            cardA.classList.add("active")
            cardB.classList.remove("active")
            banner.classList.remove("show")
            reset_btn.style.display = "none"
        }

        roll_dice_1.addEventListener('click', rollDice)
        roll_dice_2.addEventListener('click', rollDice)
        reset_btn.addEventListener('click', resetGame)

    </script>
</body>

</html>
